<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmed Elsayed Qoraymed | Financial Accountant</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--primary:#10b981;--primary-light:rgba(16,185,129,.15);--primary-dark:#059669;--accent:#3b82f6;--bg:#ffffff;--bg-alt:#f8fafc;--bg-card:#ffffff;--text:#0f172a;--text-soft:#475569;--text-muted:#94a3b8;--border:#e2e8f0;--shadow:0 4px 20px rgba(0,0,0,.06);--shadow-lg:0 20px 50px rgba(0,0,0,.1);--gradient:linear-gradient(135deg,#10b981 0%,#3b82f6 100%);--radius:16px;--font:'Poppins',sans-serif;--transition:all .3s cubic-bezier(.4,0,.2,1)}
[data-theme="dark"]{--bg:#0a0e1a;--bg-alt:#111827;--bg-card:#1a1f2e;--text:#f1f5f9;--text-soft:#cbd5e1;--text-muted:#64748b;--border:#1e293b}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;transition:background .4s,color .4s}
[dir="rtl"]{font-family:'Cairo',sans-serif}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg-alt)}
::-webkit-scrollbar-thumb{background:var(--primary);border-radius:10px}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInRight{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes gradient{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
[data-animate="true"] .reveal{opacity:0;transform:translateY(30px);transition:all .8s}
[data-animate="true"] .reveal.visible{opacity:1;transform:translateY(0)}
.header{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);transition:var(--transition)}
[data-theme="dark"] .header{background:rgba(10,14,26,.85)}
.header.scrolled{box-shadow:var(--shadow)}
.nav{max-width:1400px;margin:0 auto;padding:15px 30px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:800}
.logo-icon{width:44px;height:44px;border-radius:12px;background:var(--gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:900;box-shadow:0 8px 20px rgba(16,185,129,.3)}
.logo-text{background:var(--gradient);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-menu{display:flex;align-items:center;gap:8px;list-style:none}
.nav-link{padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;color:var(--text-soft);transition:var(--transition)}
.nav-link:hover{color:var(--primary);background:var(--primary-light)}
.nav-link.active{color:var(--primary);background:var(--primary-light);font-weight:600}
.nav-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:42px;height:42px;border-radius:12px;background:var(--bg-alt);display:flex;align-items:center;justify-content:center;color:var(--text);font-size:16px;transition:var(--transition);border:1px solid var(--border)}
.icon-btn:hover{background:var(--primary);color:#fff;transform:translateY(-2px);box-shadow:0 8px 20px rgba(16,185,129,.3)}
.lang-btn{padding:8px 16px;border-radius:10px;background:var(--bg-alt);font-weight:600;font-size:13px;border:1px solid var(--border);transition:var(--transition)}
.lang-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.menu-toggle{display:none}
@media(max-width:1024px){.nav-menu{position:fixed;top:75px;right:-100%;flex-direction:column;align-items:stretch;width:280px;height:calc(100vh - 75px);background:var(--bg);padding:20px;transition:right .3s;box-shadow:var(--shadow-lg);gap:4px;overflow-y:auto}[dir="rtl"] .nav-menu{right:auto;left:-100%;transition:left .3s}.nav-menu.open{right:0}[dir="rtl"] .nav-menu.open{left:0}.menu-toggle{display:flex}}
.hero{min-height:100vh;display:flex;align-items:center;padding:120px 30px 60px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 50%,var(--primary-light) 0%,transparent 50%),radial-gradient(circle at 80% 80%,rgba(59,130,246,.1) 0%,transparent 50%);z-index:0}
.hero-container{max-width:1400px;margin:0 auto;width:100%;display:grid;grid-template-columns:1.2fr 1fr;gap:60px;align-items:center;position:relative;z-index:1}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:50px;background:var(--primary-light);color:var(--primary);font-size:13px;font-weight:600;margin-bottom:20px;animation:fadeInUp .6s}
.hero-title{font-size:clamp(36px,5vw,64px);font-weight:900;line-height:1.1;margin-bottom:20px;animation:fadeInUp .8s}
.hero-title .gradient{background:var(--gradient);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 200%;animation:gradient 4s ease infinite}
.hero-subtitle{font-size:clamp(16px,2vw,20px);color:var(--text-soft);margin-bottom:30px;animation:fadeInUp 1s}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:30px;animation:fadeInUp 1.2s}
.stat-card{padding:20px;border-radius:var(--radius);background:var(--bg-card);border:1px solid var(--border);text-align:center;transition:var(--transition)}
.stat-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:var(--primary)}
.stat-num{font-size:32px;font-weight:900;background:var(--gradient);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat-lbl{font-size:13px;color:var(--text-muted);margin-top:4px}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;animation:fadeInUp 1.4s}
.btn{padding:14px 28px;border-radius:12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:10px;transition:var(--transition);cursor:pointer;border:2px solid transparent}
.btn-primary{background:var(--gradient);color:#fff;box-shadow:0 8px 20px rgba(16,185,129,.3)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(16,185,129,.4)}
.btn-outline{background:transparent;color:var(--text);border:2px solid var(--border)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-3px)}
.btn-whatsapp{background:#25D366;color:#fff}
.btn-whatsapp:hover{background:#1ebe5d;transform:translateY(-3px);box-shadow:0 12px 30px rgba(37,211,102,.4)}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover{background:#dc2626;transform:translateY(-3px)}
.btn-sm{padding:8px 16px;font-size:12px}
.hero-visual{position:relative;display:flex;justify-content:center;align-items:center;animation:fadeInRight 1s}
.profile-frame{position:relative;max-width:100%}
.profile-bg{position:absolute;inset:0;background:var(--gradient);border-radius:50%;filter:blur(60px);opacity:.3;animation:pulse 4s ease-in-out infinite}
.profile-img{position:relative;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;overflow:hidden;border:6px solid var(--bg);box-shadow:var(--shadow-lg);transition:border-radius .4s}
.profile-img img{width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.floating-card{position:absolute;padding:14px 20px;border-radius:14px;background:var(--bg-card);border:1px solid var(--border);box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;animation:float 3s ease-in-out infinite}
.floating-card i{font-size:20px;color:var(--primary)}
.fc-1{top:10%;left:-10%;animation-delay:0s}
.fc-2{bottom:20%;right:-10%;animation-delay:1s}
.fc-3{bottom:-5%;left:10%;animation-delay:2s}
@media(max-width:1024px){.hero-container{grid-template-columns:1fr;text-align:center}.hero-actions,.hero-stats{justify-content:center}.hero-visual{order:-1}.floating-card{display:none}}
.section{padding:80px 30px;position:relative}
.section-alt{background:var(--bg-alt)}
.container{max-width:1400px;margin:0 auto}
.section-header{text-align:center;margin-bottom:60px}
.section-badge{display:inline-block;padding:6px 16px;border-radius:50px;background:var(--primary-light);color:var(--primary);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:16px}
.section-title{font-size:clamp(28px,4vw,44px);font-weight:900;margin-bottom:16px}
.section-subtitle{font-size:16px;color:var(--text-soft);max-width:600px;margin:0 auto}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.about-text p{color:var(--text-soft);font-size:16px;margin-bottom:16px;line-height:1.8}
.about-features{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
.feature-item{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;background:var(--bg-card);border:1px solid var(--border);transition:var(--transition)}
.feature-item:hover{border-color:var(--primary);transform:translateX(5px)}
[dir="rtl"] .feature-item:hover{transform:translateX(-5px)}
.feature-icon{width:40px;height:40px;border-radius:10px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.about-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.info-card{padding:24px;border-radius:var(--radius);background:var(--bg-card);border:1px solid var(--border);transition:var(--transition)}
.info-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:var(--primary)}
.info-card i{font-size:28px;color:var(--primary);margin-bottom:12px}
.info-card h4{font-size:14px;color:var(--text-muted);margin-bottom:4px;font-weight:500}
.info-card p{font-size:16px;font-weight:700}
@media(max-width:768px){.about-grid,.about-features,.about-cards{grid-template-columns:1fr}}
.timeline{position:relative;max-width:1000px;margin:0 auto;padding:20px 0}
.timeline::before{content:'';position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:3px;background:var(--gradient)}
[dir="rtl"] .timeline::before{left:auto;right:50%;transform:translateX(50%)}
.timeline-item{position:relative;width:50%;padding:20px 40px;margin-bottom:20px}
.timeline-item:nth-child(odd){left:0}
.timeline-item:nth-child(even){left:50%}
[dir="rtl"] .timeline-item:nth-child(odd){left:auto;right:0}
[dir="rtl"] .timeline-item:nth-child(even){left:auto;right:50%}
.timeline-dot{position:absolute;top:30px;width:20px;height:20px;border-radius:50%;background:var(--primary);border:4px solid var(--bg);box-shadow:0 0 0 3px var(--primary);z-index:1}
.timeline-item:nth-child(odd) .timeline-dot{right:-10px}
.timeline-item:nth-child(even) .timeline-dot{left:-10px}
[dir="rtl"] .timeline-item:nth-child(odd) .timeline-dot{right:auto;left:-10px}
[dir="rtl"] .timeline-item:nth-child(even) .timeline-dot{left:auto;right:-10px}
.timeline-card{padding:24px;border-radius:var(--radius);background:var(--bg-card);border:1px solid var(--border);transition:var(--transition)}
.timeline-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:var(--primary)}
.timeline-date{display:inline-block;padding:4px 12px;border-radius:50px;background:var(--primary-light);color:var(--primary);font-size:12px;font-weight:700;margin-bottom:12px}
.timeline-title{font-size:18px;font-weight:700;margin-bottom:4px}
.timeline-company{color:var(--primary);font-weight:600;margin-bottom:12px;font-size:14px}
.timeline-desc{color:var(--text-soft);font-size:14px;line-height:1.7}
.timeline-desc ul{list-style:none;padding:0;margin-top:8px}
.timeline-desc li{padding:4px 0;padding-left:20px;position:relative}
[dir="rtl"] .timeline-desc li{padding-left:0;padding-right:20px}
.timeline-desc li::before{content:'✓';position:absolute;left:0;color:var(--primary);font-weight:700}
[dir="rtl"] .timeline-desc li::before{left:auto;right:0}
@media(max-width:768px){.timeline::before{left:20px}[dir="rtl"] .timeline::before{left:auto;right:20px}.timeline-item,.timeline-item:nth-child(even),[dir="rtl"] .timeline-item,[dir="rtl"] .timeline-item:nth-child(even){width:100%;left:0;right:0;padding-left:50px;padding-right:10px}[dir="rtl"] .timeline-item,[dir="rtl"] .timeline-item:nth-child(even){padding-left:10px;padding-right:50px}.timeline-item .timeline-dot,.timeline-item:nth-child(odd) .timeline-dot,.timeline-item:nth-child(even) .timeline-dot,[dir="rtl"] .timeline-item .timeline-dot{left:10px;right:auto}[dir="rtl"] .timeline-item .timeline-dot{left:auto;right:10px}}
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.skill-category{padding:28px;border-radius:var(--radius);background:var(--bg-card);border:1px solid var(--border);transition:var(--transition)}
.skill-category:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:var(--primary)}
.skill-cat-icon{width:56px;height:56px;border-radius:14px;background:var(--gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;margin-bottom:16px}
.skill-cat-title{font-size:18px;font-weight:700;margin-bottom:16px}
.skill-list{display:flex;flex-wrap:wrap;gap:8px}
.skill-tag{padding:6px 14px;border-radius:50px;background:var(--bg-alt);border:1px solid var(--border);font-size:12px;font-weight:600;transition:var(--transition)}
.skill-tag:hover{background:var(--primary);color:#fff;border-color:var(--primary);transform:scale(1.05)}
.apps-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.app-card{position:relative;padding:32px;border-radius:var(--radius);background:var(--bg-card);border:1px solid var(--border);overflow:hidden;transition:var(--transition);cursor:pointer}
.app-card:hover{transform:translateY(-8px);box-shadow:var(--shadow-lg);border-color:var(--primary)}
.app-icon{width:72px;height:72px;border-radius:18px;background:var(--gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;margin-bottom:20px;box-shadow:0 10px 30px rgba(16,185,129,.3);transition:var(--transition)}
.app-card:hover .app-icon{transform:scale(1.1) rotate(-5deg)}
.app-title{font-size:22px;font-weight:800;margin-bottom:8px}
.app-desc{color:var(--text-soft);font-size:14px;margin-bottom:20px;line-height:1.7}
.app-features{list-style:none;margin-bottom:20px}
.app-features li{padding:6px 0;font-size:13px;display:flex;align-items:center;gap:8px;color:var(--text-soft)}
.app-features i{color:var(--primary);font-size:12px}
.app-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:10px;background:var(--primary);color:#fff;font-size:13px;font-weight:600;transition:var(--transition)}
.app-card:hover .app-btn{background:var(--primary-dark);gap:12px}
.services-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.service-card{padding:28px;border-radius:var(--radius);background:var(--bg-card);border:1px solid var(--border);transition:var(--transition);position:relative;overflow:hidden}
.service-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--gradient);transform:scaleX(0);transition:var(--transition);transform-origin:left}
.service-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:var(--primary)}
.service-card:hover::before{transform:scaleX(1)}
.service-icon{width:56px;height:56px;border-radius:14px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:16px;transition:var(--transition)}
.service-card:hover .service-icon{background:var(--gradient);color:#fff;transform:rotate(-5deg)}
.service-title{font-size:17px;font-weight:700;margin-bottom:8px}
.service-desc{color:var(--text-soft);font-size:14px;line-height:1.7}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.contact-info{padding:32px;border-radius:var(--radius);background:var(--gradient);color:#fff;position:relative;overflow:hidden}
.contact-info h3{font-size:24px;font-weight:800;margin-bottom:8px}
.contact-info p{opacity:.9;margin-bottom:24px;font-size:14px}
.contact-list{list-style:none}
.contact-item{display:flex;align-items:center;gap:16px;padding:16px;margin-bottom:12px;background:rgba(255,255,255,.1);border-radius:12px;backdrop-filter:blur(10px);transition:var(--transition)}
.contact-item:hover{background:rgba(255,255,255,.2);transform:translateX(5px)}
[dir="rtl"] .contact-item:hover{transform:translateX(-5px)}
.contact-icon{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.contact-label{font-size:12px;opacity:.8}
.contact-value{font-size:15px;font-weight:600;word-break:break-all}
.contact-form{padding:32px;border-radius:var(--radius);background:var(--bg-card);border:1px solid var(--border)}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text)}
.form-input,.form-textarea{width:100%;padding:12px 16px;background:var(--bg-alt);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;transition:var(--transition)}
.form-input:focus,.form-textarea:focus{outline:none;border-color:var(--primary);background:var(--bg)}
.form-textarea{resize:vertical;min-height:120px;font-family:inherit}
@media(max-width:768px){.contact-grid{grid-template-columns:1fr}}
.footer{padding:40px 30px;background:var(--bg-alt);border-top:1px solid var(--border);text-align:center}
.social-links{display:flex;justify-content:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.social-link{width:44px;height:44px;border-radius:12px;background:var(--bg-card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);font-size:16px;transition:var(--transition)}
.social-link:hover{background:var(--gradient);color:#fff;transform:translateY(-3px);border-color:transparent}
.footer-text{color:var(--text-muted);font-size:14px}
.footer-text .heart{color:#ef4444;animation:pulse 1.5s infinite}
.whatsapp-float{position:fixed;bottom:30px;right:30px;z-index:999;width:60px;height:60px;border-radius:50%;background:#25D366;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 10px 30px rgba(37,211,102,.4);transition:var(--transition);animation:pulse 2s infinite}
[dir="rtl"] .whatsapp-float{right:auto;left:30px}
.whatsapp-float:hover{transform:scale(1.1)}
.modal-overlay{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:20px;animation:fadeIn .3s}
.modal-overlay.active{display:flex}
.modal{background:var(--bg);border-radius:var(--radius);width:100%;max-width:1400px;max-height:95vh;display:flex;flex-direction:column;overflow:hidden;animation:scaleIn .3s;border:1px solid var(--border)}
.modal-header{padding:16px 24px;background:var(--bg-alt);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.modal-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
.modal-title i{color:var(--primary)}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap}
.modal-body{flex:1;overflow-y:auto;background:var(--bg)}
.modal-close{width:36px;height:36px;border-radius:10px;background:var(--bg-card);display:flex;align-items:center;justify-content:center;transition:var(--transition);border:1px solid var(--border)}
.modal-close:hover{background:#ef4444;color:#fff;border-color:#ef4444;transform:rotate(90deg)}
.admin-login{padding:60px 30px;display:flex;align-items:center;justify-content:center;min-height:60vh}
.login-box{width:100%;max-width:420px;padding:40px;border-radius:var(--radius);background:var(--bg-card);border:1px solid var(--border);box-shadow:var(--shadow-lg);text-align:center}
.login-icon{width:80px;height:80px;border-radius:20px;background:var(--gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-size:36px;margin:0 auto 20px;box-shadow:0 10px 30px rgba(16,185,129,.3)}
.login-title{font-size:24px;font-weight:800;margin-bottom:8px}
.login-subtitle{color:var(--text-muted);font-size:14px;margin-bottom:24px}
.admin-panel{padding:24px}
.admin-tabs{display:flex;gap:4px;margin-bottom:24px;background:var(--bg-alt);padding:6px;border-radius:12px;overflow-x:auto;flex-wrap:wrap}
.admin-tab{padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-soft);transition:var(--transition);white-space:nowrap;display:flex;align-items:center;gap:8px;cursor:pointer}
.admin-tab:hover{color:var(--text)}
.admin-tab.active{background:var(--primary);color:#fff}
.admin-card{padding:24px;border-radius:var(--radius);background:var(--bg-card);border:1px solid var(--border);margin-bottom:20px}
.admin-card h3{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.admin-card h3 i{color:var(--primary)}
.admin-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:768px){.admin-row{grid-template-columns:1fr}}
.admin-field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.admin-field input,.admin-field select,.admin-field textarea{width:100%;padding:10px 14px;background:var(--bg-alt);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;transition:var(--transition)}
.admin-field input:focus,.admin-field select:focus,.admin-field textarea:focus{outline:none;border-color:var(--primary)}
.admin-field .slider-row{display:flex;align-items:center;gap:12px}
.admin-field .slider-row input[type="range"]{flex:1}
.admin-field .slider-row .slider-val{min-width:60px;text-align:center;font-weight:700;color:var(--primary)}
.color-picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:8px;margin-top:8px}
.color-swatch{width:40px;height:40px;border-radius:10px;cursor:pointer;transition:var(--transition);border:3px solid transparent}
.color-swatch:hover{transform:scale(1.1)}
.color-swatch.active{border-color:var(--text);transform:scale(1.1)}
.template-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:12px}
.template-card{padding:16px;border-radius:12px;background:var(--bg-alt);border:2px solid var(--border);cursor:pointer;transition:var(--transition);text-align:center}
.template-card:hover{border-color:var(--primary);transform:translateY(-3px)}
.template-card.active{border-color:var(--primary);background:var(--primary-light)}
.template-preview{height:60px;border-radius:8px;margin-bottom:8px;display:flex;overflow:hidden}
.template-preview span{flex:1}
.template-name{font-size:12px;font-weight:600}
.toast-container{position:fixed;top:20px;right:20px;z-index:3000;display:flex;flex-direction:column;gap:10px}
[dir="rtl"] .toast-container{right:auto;left:20px}
.toast{padding:14px 20px;border-radius:12px;background:var(--bg-card);border:1px solid var(--border);box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:12px;min-width:280px;animation:slideIn .3s}
.toast.success{border-left:4px solid #10b981}
.toast.error{border-left:4px solid #ef4444}
.toast.info{border-left:4px solid #3b82f6}
.toast i{font-size:20px}
.toast.success i{color:#10b981}
.toast.error i{color:#ef4444}
.toast.info i{color:#3b82f6}
.resume-preview{background:#fff;color:#000;padding:40px;border-radius:var(--radius);max-width:900px;margin:0 auto;box-shadow:var(--shadow-lg);font-family:'Poppins',sans-serif;line-height:1.6}
.resume-preview[dir="rtl"]{font-family:'Cairo',sans-serif;text-align:right}
.r-header{padding-bottom:20px;margin-bottom:24px;border-bottom:3px solid var(--accent,#10b981)}
.r-name{font-size:32px;font-weight:900;color:#0f172a;margin-bottom:4px}
.r-title{font-size:16px;color:var(--accent,#10b981);font-weight:600;margin-bottom:12px}
.r-contact{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:#475569}
.r-contact span{display:flex;align-items:center;gap:6px}
.r-section{margin-bottom:24px}
.r-section-title{font-size:16px;font-weight:800;color:var(--accent,#10b981);text-transform:uppercase;letter-spacing:1px;padding-bottom:6px;margin-bottom:12px;border-bottom:2px solid #e2e8f0}
.r-exp-item{margin-bottom:16px}
.r-exp-header{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.r-exp-title{font-size:15px;font-weight:700;color:#0f172a}
.r-exp-company{font-size:14px;color:var(--accent,#10b981);font-weight:600}
.r-exp-date{font-size:13px;color:#64748b;font-style:italic}
.r-exp-desc{font-size:13px;color:#475569;margin-top:6px}
.r-exp-desc ul{padding-left:18px;margin-top:4px}
[dir="rtl"] .r-exp-desc ul{padding-left:0;padding-right:18px}
.r-skills-list{display:flex;flex-wrap:wrap;gap:8px}
.r-skill-tag{padding:4px 12px;border-radius:50px;background:#f1f5f9;color:#0f172a;font-size:12px;font-weight:600;border:1px solid #e2e8f0}

function loadState() {
  try {
    const saved = localStorage.getItem('siteData');
    if (saved) return deepMerge(JSON.parse(JSON.stringify(DEFAULT_DATA)), JSON.parse(saved));
  } catch (e) { console.error(e); }
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
function deepMerge(target, source) {
  for (const key in source) {
    if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
      if (!target[key]) target[key] = {};
      deepMerge(target[key], source[key]);
    } else target[key] = source[key];
  }
  return target;
}
function saveState() { localStorage.setItem('siteData', JSON.stringify(DATA)); }
function t(obj) {
  if (!obj) return '';
  if (typeof obj === 'string') return obj;
  return obj[LANG] || obj.en || '';
}

/* ============ THEME ============ */
function applyTheme() {
  const th = DATA.theme;
  document.documentElement.setAttribute('data-theme', th.mode);
  document.documentElement.setAttribute('data-template', th.template);
  document.documentElement.style.setProperty('--primary', th.primaryColor);
  if (th.customGradient) document.documentElement.style.setProperty('--gradient', th.customGradient);
  else document.documentElement.style.setProperty('--gradient', `linear-gradient(135deg,${th.primaryColor},${shadeColor(th.primaryColor, -20)})`);
  document.documentElement.style.setProperty('--radius', th.radius + 'px');
  document.body.style.fontFamily = `'${th.font}',sans-serif`;
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  const icon = document.getElementById('themeIcon');
  if (icon) icon.className = th.mode === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
  document.getElementById('langBtn').textContent = LANG === 'en' ? 'AR' : 'EN';
  document.body.setAttribute('data-animate', th.animate);
  document.title = DATA.general.siteName + ' | Financial Accountant';
}
function shadeColor(c, p) {
  let R = parseInt(c.substring(1, 3), 16);
  let G = parseInt(c.substring(3, 5), 16);
  let B = parseInt(c.substring(5, 7), 16);
  R = parseInt(R * (100 + p) / 100); G = parseInt(G * (100 + p) / 100); B = parseInt(B * (100 + p) / 100);
  R = R.toString(16).padStart(2, '0'); G = G.toString(16).padStart(2, '0'); B = B.toString(16).padStart(2, '0');
  return `#${R}${G}${B}`;
}

function toast(msg, type = 'info') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  const icons = { success: 'check-circle', error: 'exclamation-circle', info: 'info-circle' };
  t.innerHTML = `<i class="fas fa-${icons[type]}"></i><span>${msg}</span>`;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(100%)'; setTimeout(() => t.remove(), 300); }, 3000);
}
function initReveal() {
  if (!DATA.theme.animate) return;
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
  }, { threshold: .1 });
  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
}
function sendMessage(e) {
  e.preventDefault();
  const name = document.getElementById('msgName').value;
  const email = document.getElementById('msgEmail').value;
  const subject = document.getElementById('msgSubject').value;
  const text = document.getElementById('msgText').value;
  const msg = `*New Message from Website*%0A%0A*Name:* ${name}%0A*Email:* ${email}%0A*Subject:* ${subject}%0A%0A*Message:*%0A${text}`;
  window.open(`https://wa.me/${DATA.general.whatsapp}?text=${msg}`, '_blank');
  toast(LANG === 'ar' ? 'تم فتح واتساب...' : 'Opening WhatsApp...', 'success');
}

  const sections = DATA.nav.items.map(n => n.id);
  let current = 'home';
  sections.forEach(id => {
    const s = document.getElementById(id);
    if (s && s.getBoundingClientRect().top < 150) current = id;
  });
  document.querySelectorAll('.nav-link').forEach(l => {
    l.classList.toggle('active', l.getAttribute('href') === '#' + current);
  });
});

function downloadPDF() {
  const element = document.getElementById('printArea');
  if (!element) { toast('No content', 'error'); return; }
  toast(LANG === 'ar' ? 'جاري إنشاء PDF...' : 'Creating PDF...', 'info');
  html2canvas(element, { scale: 2, useCORS: true, logging: false, backgroundColor: '#ffffff' }).then(canvas => {
    const imgData = canvas.toDataURL('image/png');
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const imgWidth = 210;
    const pageHeight = 297;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;
    let heightLeft = imgHeight;
    let position = 0;
    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while (heightLeft >= 0) {
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    pdf.save('Ahmed_Qoraymed_Resume.pdf');
    toast(LANG === 'ar' ? 'تم تنزيل PDF بنجاح' : 'PDF downloaded successfully', 'success');
  });
}

function exportWord() {
  const content = document.getElementById('printArea');

  const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Resume</title></head><body>${content.outerHTML}</body></html>`;
  const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'Ahmed_Qoraymed_Resume.doc'; a.click();
  URL.revokeObjectURL(url);
  toast(LANG === 'ar' ? 'تم تصدير Word' : 'Word exported', 'success');
}

function toggleMenuItem(i) { DATA.nav.items[i].visible = !DATA.nav.items[i].visible; saveState(); renderAll(); renderAdminContent(); }
function editMenuItem(i) {
  const item = DATA.nav.items[i];
  const newId = prompt(LANG === 'ar' ? 'المعرف (ID):' : 'ID:', item.id); if (newId === null) return;
  const newLabelEn = prompt(LANG === 'ar' ? 'التسمية (إنجليزي):' : 'Label (EN):', item.label.en); if (newLabelEn === null) return;
  const newLabelAr = prompt(LANG === 'ar' ? 'التسمية (عربي):' : 'Label (AR):', item.label.ar); if (newLabelAr === null) return;
  const newIcon = prompt(LANG === 'ar' ? 'الأيقونة (fa-...):' : 'Icon (fa-...):', item.icon); if (newIcon === null) return;
  item.id = newId; item.label.en = newLabelEn; item.label.ar = newLabelAr; item.icon = newIcon;
  saveState(); renderAll(); renderAdminContent();
  toast(t({ en: 'Updated', ar: 'تم التحديث' }), 'success');
}
function deleteMenuItem(i) {
  if (!confirm(LANG === 'ar' ? 'هل أنت متأكد؟' : 'Are you sure?')) return;
  DATA.nav.items.splice(i, 1);
  saveState(); renderAll(); renderAdminContent();
  toast(t({ en: 'Deleted', ar: 'تم الحذف' }), 'success');
}
function addMenuItem() {
  const id = prompt(LANG === 'ar' ? 'المعرف (ID):' : 'ID:', 'newsection'); if (!id) return;
  const labelEn = prompt(LANG === 'ar' ? 'التسمية (إنجليزي):' : 'Label (EN):', 'New'); if (!labelEn) return;
  const labelAr = prompt(LANG === 'ar' ? 'التسمية (عربي):' : 'Label (AR):', 'جديد'); if (!labelAr) return;
  const icon = prompt(LANG === 'ar' ? 'الأيقونة (fa-...):' : 'Icon (fa-...):', 'fa-star'); if (!icon) return;
  DATA.nav.items.push({ id, label: { en: labelEn, ar: labelAr }, icon, visible: true });

  toast(t({ en: 'Added', ar: 'تمت الإضافة' }), 'success');
}

    <p style="font-size:13px;color:var(--text-soft);margin-bottom:12px">${LANG === 'ar' ? 'يمكنك تعديل روابط التواصل الاجتماعي من قسم التواصل' : 'You can edit social links from Contact section'}</p>
  </div>`;
}
function renderAdminPassword() {
  return `<div class="admin-card"><h3><i class="fas fa-lock"></i> ${LANG === 'ar' ? 'تغيير كلمة المرور' : 'Change Password'}</h3>
    <form onsubmit="changePassword(event)">
      <div class="admin-row">
        <div class="admin-field"><label>${LANG === 'ar' ? 'كلمة المرور الجديدة' : 'New Password'}</label><input type="password" id="newPwd" required minlength="4"></div>
        <div class="admin-field"><label>${LANG === 'ar' ? 'تأكيد كلمة المرور' : 'Confirm Password'}</label><input type="password" id="confirmPwd" required minlength="4"></div>
      </div>
      <button type="submit" class="btn btn-primary" style="margin-top:12px"><i class="fas fa-save"></i> ${LANG === 'ar' ? 'حفظ' : 'Save'}</button>
    </form>
  </div>`;
}
function changePassword(e) {
  e.preventDefault();
  const n = document.getElementById('newPwd').value;
  const c = document.getElementById('confirmPwd').value;
  if (n !== c) { toast(LANG === 'ar' ? 'كلمات المرور غير متطابقة' : 'Passwords do not match', 'error'); return; }
  DATA.general.password = n;
  saveState();
  toast(LANG === 'ar' ? 'تم تغيير كلمة المرور' : 'Password changed', 'success');
  document.getElementById('newPwd').value = '';
  document.getElementById('confirmPwd').value = '';
}

/* ============ INIT ============ */
function init() {
  applyTheme();
  renderAll();
}
init();
</script>
</body>
</html>
